<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section id="community" ref="{{ rootRef }}" aria-labelledby="s07-title" style="position:relative;overflow:hidden;isolation:isolate;margin-top:{{ mt }};padding:clamp(80px,13vh,150px) clamp(20px,5vw,80px);background:#0B0614;color:#fff">

  <div aria-hidden="true" style="position:absolute;z-index:-1;left:20%;right:-10%;bottom:-6%;height:36%;background-image:radial-gradient(rgba(201,182,251,.9) .9px,transparent 1.3px);background-size:9px 9px;-webkit-mask-image:radial-gradient(ellipse 50% 90% at 55% 100%,#000 0%,rgba(0,0,0,.4) 50%,transparent 78%);mask-image:radial-gradient(ellipse 50% 90% at 55% 100%,#000 0%,rgba(0,0,0,.4) 50%,transparent 78%);opacity:.55;pointer-events:none"></div>
  <div style="max-width:1480px;margin:0 auto;display:grid;grid-template-columns:{{ cmCols }};gap:clamp(40px,5vw,80px);align-items:center">
    <div style="position:relative;z-index:2;min-width:0;display:flex;flex-direction:column;align-items:flex-start">
      <span style="font-size:13px;font-weight:600;letter-spacing:.16em;color:#C9B6FB">OUR COMMUNITY</span>
      <h2 id="s07-title" style="margin:clamp(20px,3vh,28px) 0 0;max-width:620px;font-weight:500;font-size:clamp(34px,4.6vw,68px);line-height:1.04;letter-spacing:-.04em;color:#fff;text-wrap:balance">A community that <span style="color:#C9B6FB">turns intent into real progress.</span></h2>
      <p style="margin:clamp(18px,2.6vh,26px) 0 0;max-width:520px;font-size:clamp(17px,1.4vw,20px);line-height:1.6;color:#D9CFF0;text-wrap:pretty">Thousands of people are backing their goals, showing up every day, and proving what's possible — together.</p>
      <div style="margin-top:clamp(28px,4.5vh,40px);display:flex;flex-wrap:wrap;gap:12px">
        <dc-import name="RollButton" label="Get the app" href="#get-app" size="lg" on-click="{{ openApp }}" hint-size="190px,60px"></dc-import>
        <dc-import name="RollButton" label="How it works" href="how-it-works.html" size="lg" tone="light" on-click="{{ exploreStories }}" hint-size="200px,60px"></dc-import>
      </div>
      <div style="margin-top:clamp(28px,4.5vh,40px);display:flex;align-items:center;gap:14px">
        <div style="display:flex">
          <sc-for list="{{ cmAvatars }}" as="a" hint-placeholder-count="4">
            <img loading="lazy" decoding="async" src="{{ a.src }}" alt="" style="width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid #0B0614;margin-left:{{ a.ml }}">
          </sc-for>
        </div>
        <span style="font-size:15px;color:#D9CFF0">Real goals from people like you</span>
      </div>
    </div>
    <div style="position:relative;min-width:0">
      <sc-if value="{{ cmFan }}" hint-placeholder-val="{{ true }}">
        <svg aria-hidden="true" viewBox="0 0 1000 560" preserveAspectRatio="none" style="position:absolute;left:-4%;top:6%;width:106%;height:92%;overflow:visible;pointer-events:none;z-index:0">
          <path d="M120 70 C 40 120, 60 230, 160 300 M 880 230 C 960 330, 900 460, 640 520 C 520 545, 400 550, 300 540" fill="none" stroke="#9B7CF0" stroke-width="2" stroke-linecap="round" opacity=".9" style="filter:drop-shadow(0 0 8px rgba(155,124,240,1))"></path>

          <circle cx="760" cy="500" r="5" fill="#fff" style="filter:drop-shadow(0 0 8px #B9A1FA)"></circle>
        </svg>
      </sc-if>
      <div role="list" aria-label="Community challenges" onMouseEnter="{{ cmPause }}" onMouseLeave="{{ cmResume }}" style="{{ cmTrack }}">
        <sc-for list="{{ community }}" as="c" hint-placeholder-count="5">
          <article role="listitem" aria-label="{{ c.aria }}" onClick="{{ c.pick }}" style="{{ c.pos }}">
            <div style="position:relative;height:100%;border-radius:{{ c.rad }};overflow:hidden;box-shadow:{{ c.sh }};transition:box-shadow .8s ease;color:#25103F;cursor:pointer">
              <div style="position:absolute;inset:0;background:{{ c.bg }}"></div>
              <div style="position:absolute;inset:0;background:linear-gradient(180deg,#C9B3FB 0%,#E4D9FD 50%,#F6F2FE 100%);opacity:{{ c.ctrO }};transition:opacity .8s ease"></div>
              <img loading="lazy" decoding="async" src="{{ c.img }}" alt="{{ c.alt }}" style="position:absolute;object-fit:cover;object-position:50% 30%;display:block;background:#E6DEF4;left:{{ c.iL }};top:{{ c.iT }};width:{{ c.iW }};height:{{ c.iH }};border-radius:{{ c.iR }};transition:left .8s cubic-bezier(.65,0,.35,1),top .8s cubic-bezier(.65,0,.35,1),width .8s cubic-bezier(.65,0,.35,1),height .8s cubic-bezier(.65,0,.35,1),border-radius .8s cubic-bezier(.65,0,.35,1)">
              <div style="position:absolute;left:0;right:0;top:31%;height:36%;background:linear-gradient(180deg,rgba(228,217,253,0),#E4D9FD 92%);opacity:{{ c.ctrO }};transition:opacity .8s ease;pointer-events:none"></div>
              <div style="position:absolute;left:0;right:0;top:0;padding:{{ c.padT }};display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:{{ c.pillFs }};">
                <span style="display:inline-flex;align-items:center;gap:.45em;height:2.3em;padding:0 .85em;border-radius:100px;background:{{ c.pillBg }};-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);font-weight:600;color:#25103F;white-space:nowrap;max-width:100%;overflow:hidden;transition:background .8s ease"><svg viewBox="0 0 16 16" aria-hidden="true" style="width:1.1em;height:1.1em;flex:none"><path d="{{ c.icon }}" fill="none" stroke="#5B2EC4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>{{ c.cat }}</span>
                <span style="display:inline-flex;align-items:center;height:2.3em;padding:0 .95em;border-radius:100px;background:#7B45F5;color:#fff;font-weight:600;white-space:nowrap;flex:none;display:{{ c.dayD }};opacity:{{ c.ctrO }};transition:opacity .6s ease">{{ c.dayTxt }}</span>
              </div>
              <div style="position:absolute;left:0;right:0;bottom:0;padding:{{ c.padB }};">
                <p style="margin:0;font-weight:500;font-size:{{ c.fs }};line-height:1.1;letter-spacing:-.025em;color:#25103F;text-wrap:balance;">{{ c.promise }}</p>
                <div style="margin-top:{{ c.gap }};display:flex;align-items:center;gap:10px;"><div style="flex:1;height:{{ c.barH }};border-radius:12px;background:rgba(37,16,63,.12);overflow:hidden;"><div style="width:{{ c.pct }};height:100%;border-radius:12px;background:{{ c.barC }};transition:background .8s ease"></div></div><span style="font-size:{{ c.pctFs }};font-weight:600;font-variant-numeric:tabular-nums;">{{ c.pct }}</span></div>
              </div>
            </div>
          </article>
        </sc-for>
      </div>
      <p style="position:relative;margin:clamp(14px,2vh,22px) 0 0;text-align:center;font-size:13px;color:#A898C8">Sample community stories</p>
    </div>
  </div>
  <div
</section>
</x-dc>
